name: Trivy Vulnerability Scanner
permissions:
  issues: write
  contents: read
  security-events: write
on:
  pull_request:
    paths:
      - '**/package*.json'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - '.github/workflows/**'
jobs:
  scan:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities_found: ${{ steps.parse-results.outputs.vulnerabilities_found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Run Trivy scan and generate reports (SARIF + JSON)
        run: |
          trivy fs \
            --format template \
            --template '@/contrib/sarif.tpl' \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --no-progress .
          trivy fs \
            --format json \
            --output trivy-results.json \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --no-progress .
      - name: Check for HIGH or CRITICAL vulnerabilities
        id: parse-results
        run: |
          if jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length > 0' trivy-results.json; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload Trivy JSON report as artifact
        if: steps.parse-results.outputs.vulnerabilities_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-results.json
          retention-days: 1
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-fs
  create-issue:
    name: Create Vulnerability Issue
    needs: [scan]
    if: needs.scan.outputs.vulnerabilities_found == 'true'
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Download Trivy JSON report
        uses: actions/download-artifact@v4
        with:
          name: trivy-json-report
          
      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh
  
      - name: Generate issue content and check for duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create JQ filter for parsing vulnerabilities with full details
          cat <<'EOF' > filter.jq
          .Results[]? | .Vulnerabilities[]? | 
          select(.Severity == "HIGH" or .Severity == "CRITICAL") |
          {
            id: .VulnerabilityID,
            severity: .Severity,
            package: .PkgName,
            version: .InstalledVersion,
            fixed: (.FixedVersion // "N/A"),
            title: .Title,
            description: .Description,
            cvss_score: (.CVSS // {} | .nvd // {} | .V3Score // "N/A"),
            references: (.References // [])
          }
          EOF
          
          # Extract unique vulnerabilities with full details
          jq -r -f filter.jq trivy-results.json > current-vulns.json
          
          # Get unique vulnerability IDs
          VULN_IDS=$(jq -r '.id' current-vulns.json | sort -u | tr '\n' ' ')
          echo "Found vulnerabilities: $VULN_IDS"
          
          # Check for existing issues with these vulnerability IDs
          NEW_VULNS=""
          EXISTING_ISSUES=""
          
          for vuln_id in $VULN_IDS; do
            echo "Checking for existing issue with vulnerability: $vuln_id"
            
            # Search for existing issues with this vulnerability ID in title or body
            existing_issue=$(gh issue list --state=open --search="$vuln_id" --json number,title,body --limit 100 | \
              jq -r --arg vuln "$vuln_id" '.[] | select(.title | contains($vuln) or (.body | contains($vuln))) | .number' | head -1)
            
            if [[ -z "$existing_issue" ]]; then
              echo "No existing issue found for $vuln_id"
              NEW_VULNS="$NEW_VULNS $vuln_id"
            else
              echo "Found existing issue #$existing_issue for vulnerability $vuln_id"
              EXISTING_ISSUES="$EXISTING_ISSUES #$existing_issue"
            fi
          done
          
          # If no new vulnerabilities, but existing ones found, add PR reference to existing issues
          if [[ -z "$NEW_VULNS" && -n "$EXISTING_ISSUES" ]]; then
            echo "All vulnerabilities already have existing issues. Adding PR reference to existing issues."
            echo "create_issue=false" >> $GITHUB_OUTPUT
            echo "existing_issues=$EXISTING_ISSUES" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # If no new vulnerabilities and no existing ones, exit
          if [[ -z "$NEW_VULNS" ]]; then
            echo "No vulnerabilities found. Skipping issue creation."
            echo "create_issue=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "create_issue=true" >> $GITHUB_OUTPUT
          echo "existing_issues=$EXISTING_ISSUES" >> $GITHUB_OUTPUT
          echo "New vulnerabilities to report: $NEW_VULNS"
          
          # Create comprehensive issue content for new vulnerabilities
          cat <<'EOF' > filter_new.jq
          "### 🚨 Security Vulnerabilities Detected\n\n" +
          "**Detected in PR:** [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})\n" +
          "**Branch:** `${{ github.event.pull_request.head.ref }}`\n" +
          "**Scan Date:** `" + (now | strftime("%Y-%m-%d %H:%M:%S UTC")) + "`\n\n" +
          "---\n\n" +
          (
            [.Results[]? | .Vulnerabilities[]? | 
            select(.Severity == "HIGH" or .Severity == "CRITICAL") |
            select(.VulnerabilityID | IN($new_vulns[]))] | 
            group_by(.VulnerabilityID) | 
            map(
              .[0] | 
              "## 🔴 " + .VulnerabilityID + " - " + .Severity + " Severity\n\n" +
              "**CVSS Score:** " + ((.CVSS // {} | .nvd // {} | .V3Score // "N/A") | tostring) + "\n" +
              "**Title:** " + (.Title // "N/A") + "\n\n" +
              "### Description\n" +
              (.Description // "No description available") + "\n\n" +
              "### Affected Package(s)\n" +
              "| Package | Installed Version | Fixed Version |\n" +
              "|---------|------------------|---------------|\n" +
              (
                [.Results[]? | .Vulnerabilities[]? | 
                select(.VulnerabilityID == .VulnerabilityID)] | 
                map("| " + .PkgName + " | " + .InstalledVersion + " | " + (.FixedVersion // "N/A") + " |") | 
                join("\n")
              ) + "\n\n" +
              "### References\n" +
              (
                if (.References // []) | length > 0 then
                  (.References | map("- " + .) | join("\n"))
                else
                  "- [NVD Database](https://nvd.nist.gov/vuln/detail/" + .VulnerabilityID + ")\n" +
                  "- [Aqua Security](https://avd.aquasec.com/nvd/" + (.VulnerabilityID | ascii_downcase) + ")"
                end
              ) + "\n\n" +
              "---\n"
            ) | 
            join("\n")
          ) +
          "\n### 🔧 Remediation Steps\n\n" +
          "1. Review the affected packages listed above\n" +
          "2. Update to the fixed versions where available\n" +
          "3. If no fix is available, consider:\n" +
          "   - Finding alternative packages\n" +
          "   - Implementing additional security measures\n" +
          "   - Monitoring for updates\n\n" +
          "### 📋 Next Steps\n\n" +
          "- [ ] Assign this issue to a developer\n" +
          "- [ ] Prioritize based on CVSS scores and affected systems\n" +
          "- [ ] Update dependencies\n" +
          "- [ ] Re-run security scan to verify fixes\n" +
          "- [ ] Update this issue when resolved\n\n" +
          "---\n" +
          "*This issue was automatically created by Trivy vulnerability scanner*"
          EOF
          
          # Convert NEW_VULNS to JSON array for jq
          echo "$NEW_VULNS" | tr ' ' '\n' | grep -v '^
        id: check-duplicates
  
      - name: Create GitHub Issue for new vulnerabilities
        if: steps.check-duplicates.outputs.create_issue == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: ${{ steps.check-duplicates.outputs.ISSUE_TITLE }}
          content-filepath: cve-issue-report.md
          labels: |
            security
            vulnerability
            high-priority
          assignees: ${{ github.actor }}
          
      - name: Comment on existing issues with PR reference
        if: steps.check-duplicates.outputs.existing_issues != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for issue_num in ${{ steps.check-duplicates.outputs.existing_issues }}; do
            issue_num=$(echo $issue_num | sed 's/#//')
            echo "Adding PR reference to existing issue #$issue_num"
            
            gh issue comment $issue_num --body "🔗 **Related PR**: [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})
            
            This vulnerability was also detected in the above PR on branch \`${{ github.event.pull_request.head.ref }}\`.
            
            *Auto-generated by Trivy scanner on $(date)*"
          done | jq -R . | jq -s . > new_vulns.json
          
          # Generate comprehensive issue content for new vulnerabilities only
          jq -r --slurpfile new_vulns new_vulns.json -f filter_new.jq trivy-results.json > cve-issue-report.md
          
          # Create a title that includes the vulnerability IDs for better searchability
          TITLE_VULNS=$(echo "$NEW_VULNS" | tr ' ' ',' | sed 's/,$//' | sed 's/^,//')
          echo "ISSUE_TITLE=🔒 Security Alert: $TITLE_VULNS" >> $GITHUB_OUTPUT
        id: check-duplicates
  
      - name: Create GitHub Issue for new vulnerabilities
        if: steps.check-duplicates.outputs.create_issue == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: ${{ steps.check-duplicates.outputs.ISSUE_TITLE }}
          content-filepath: cve-issue-report.md
          labels: |
            security
            vulnerability
          assignees: ${{ github.actor }}
